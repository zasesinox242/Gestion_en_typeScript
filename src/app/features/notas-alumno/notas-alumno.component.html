<div class="page-header">
  <a routerLink="/profesor" class="back-link">← Mis cursos</a>
  <h1>{{ nombreCurso }} · Notas</h1>
  <p class="text-muted">Notas registradas para este curso (escala 0–20).</p>
</div>

<div class="card">
  <div class="card-body">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nombres</th>
          <th>Apellidos</th>
          <th>Nota</th>
          <th style="width: 160px">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let alumno of alumnos">
          <td>{{ alumno.nombres }}</td>
          <td>{{ alumno.apellidos }}</td>
          <td class="mono">
            <span *ngIf="!alumno.editando">{{ alumno.nota ?? '—' }}</span>
            <input
              *ngIf="alumno.editando"
              type="number"
              min="0"
              max="20"
              [(ngModel)]="alumno.nota"
              name="nota-{{alumno.alumnoId}}"
            />
          </td>
          <td class="actions-cell">
            <button *ngIf="!alumno.editando" class="btn btn-outline btn-sm" (click)="editar(alumno)">Editar</button>
            <button *ngIf="alumno.editando" class="btn btn-primary btn-sm" (click)="guardar(alumno)">Guardar</button>
          </td>
        </tr>
        <tr *ngIf="alumnos.length === 0">
          <td colspan="4" class="text-muted">No hay alumnos matriculados en este curso.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
