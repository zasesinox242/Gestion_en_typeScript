<div class="login-page">
  <div class="login-card card">
    <div class="login-brand">
      <span class="brand-mark">GA</span>
      <h1>Gestión Académica</h1>
      <p class="text-muted">Ingresa con tu cuenta para continuar.</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          [(ngModel)]="usuario"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn btn-primary btn-login" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>

  <footer class="login-footer text-muted">© Instituto — 2026</footer>
</div>
