<div class="login-page">
  <div class="login-card card">
    <div class="login-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor" aria-hidden="true">
          <path d="M12 3 1 8l11 5 9-4.09V17h2V8L12 3zm0 7.18L4.09 8 12 4.82 19.91 8 12 10.18zM5 13.18v3.64C5 19.1 8.13 21 12 21s7-1.9 7-4.18v-3.64l-7 3.18-7-3.18z"/>
        </svg>
      </span>
      <h1>Institución Educativa</h1>
      <p class="text-muted">Ingresa con tu cuenta para continuar.</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          [(ngModel)]="usuario"
          autocomplete="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          required
        />
      </div>

      <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="btn btn-primary btn-login" [disabled]="cargando">
        {{ cargando ? 'Ingresando…' : 'Iniciar sesión' }}
      </button>
    </form>
  </div>

  <footer class="login-footer text-muted">© Institución Educativa — 2026</footer>
</div>
