<div class="page-header">
  <h1>Mis cursos</h1>
  <p class="text-muted">Cursos en los que estás matriculado.</p>
</div>

<div class="cursos-grid">
  <div *ngFor="let curso of cursos" class="card curso-card">
    <h2>{{ curso.nombre }}</h2>
  </div>
  <p *ngIf="cursos.length === 0" class="text-muted">No estás matriculado en ningún curso.</p>
</div>
