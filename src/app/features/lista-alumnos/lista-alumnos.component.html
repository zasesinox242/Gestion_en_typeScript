<div class="page-header">
  <a routerLink="/admin/gestion-cursos" class="back-link">← Cursos</a>
  <h1>{{ nombreCurso }} · Alumnos</h1>
  <p class="text-muted">Alumnos matriculados en este curso.</p>
</div>

<div class="card">
  <div class="card-body">
    <app-editable-table
      [items]="alumnos"
      [columnas]="columnas"
      mensajeVacio="Ningún alumno matriculado todavía."
      (guardar)="guardar($event)"
      (eliminar)="eliminar($event)"
    ></app-editable-table>

    <form class="inline-form" (ngSubmit)="agregarAlumno()">
      <input placeholder="Nombres" [(ngModel)]="nuevoAlumno.nombres" name="nombres" />
      <input placeholder="Apellidos" [(ngModel)]="nuevoAlumno.apellidos" name="apellidos" />
      <input type="number" placeholder="Edad" [(ngModel)]="nuevoAlumno.edad" name="edad" />
      <button type="submit" class="btn btn-accent">+ Agregar alumno</button>
    </form>
  </div>
</div>
