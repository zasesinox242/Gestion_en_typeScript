<div class="shell" [class]="'shell--' + rol">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
          <path d="M12 3 1 8l11 5 9-4.09V17h2V8L12 3zm0 7.18L4.09 8 12 4.82 19.91 8 12 10.18zM5 13.18v3.64C5 19.1 8.13 21 12 21s7-1.9 7-4.18v-3.64l-7 3.18-7-3.18z"/>
        </svg>
      </span>
      <span class="brand-name">Institución Educativa</span>
    </div>

    <nav class="sidebar-nav">
      <a
        *ngFor="let item of navItems"
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        class="nav-link"
      >
        {{ item.label }}
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <span class="user-avatar">{{ inicial }}</span>
        <div class="user-info">
          <span class="user-name">{{ nombreUsuario }}</span>
          <span [class]="badgeClass">{{ rolLabel }}</span>
        </div>
      </div>
      <button class="btn btn-outline btn-sm logout-btn" (click)="onLogout()">
        Cerrar sesión
      </button>
    </div>
  </aside>

  <main class="shell-content">
    <router-outlet></router-outlet>
  </main>
</div>
